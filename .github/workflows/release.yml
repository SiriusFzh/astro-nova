name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
      - run: pip install -r requirements.txt pyinstaller

      # Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm install

      # Build
      - run: npm run build
        env:
          ELECTRON_BUILDER_BINARIES_MIRROR: ${{ secrets.ELECTRON_MIRROR || '' }}

      # macOS code sign + notarize (requires Apple Developer credentials)
      - name: Import code-signing certificate
        if: runner.os == 'macOS' && env.APPLE_ID != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERT_P12 }}
          p12-password: ${{ secrets.APPLE_CERT_PASSWORD }}

      - name: Code sign
        if: runner.os == 'macOS' && env.APPLE_ID != ''
        run: |
          codesign --force --options runtime --deep \
            --sign "$APPLE_DEV_IDENTITY" \
            dist/*.dmg dist/*.zip
        env:
          APPLE_DEV_IDENTITY: ${{ secrets.APPLE_DEV_IDENTITY || 'Developer ID Application' }}

      - name: Notarize
        if: runner.os == 'macOS' && env.APPLE_ID != ''
        run: |
          for f in dist/*.dmg dist/*.zip; do
            xcrun notarytool submit "$f" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
          done
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Upload artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: astro-nova-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.dmg
            dist/*.zip
            dist/latest.yml
            dist/latest-mac.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4

      - name: Collect artifacts
        run: |
          mkdir artifacts
          find . -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "*.blockmap" -o -name "latest*.yml" \) -exec cp {} artifacts/ \;
          ls -la artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: false
          generate_release_notes: true
